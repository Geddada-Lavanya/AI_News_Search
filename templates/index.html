<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI News Search</title>


    <style>
    /* =========================
       GLOBAL STYLES
    ========================= */

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8f9ff);
        color: #222;
        min-height: 100vh;
    }

    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
        width: 90%;
        max-width: 1100px;
        margin: 50px auto;
    }

    /* =========================
       HEADING
    ========================= */

    h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #312e81;
        font-size: 38px;
        font-weight: 700;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 35px;
        font-size: 17px;
    }

    /* =========================
       SEARCH BOX
    ========================= */

    .search-box {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 16px;

        box-shadow:
            0 10px 30px rgba(79, 70, 229, 0.12);

        border: 1px solid #e0e7ff;

        transition: 0.3s ease;
    }

    .search-box:hover {
        transform: translateY(-2px);

        box-shadow:
            0 15px 35px rgba(79, 70, 229, 0.18);
    }

    /* =========================
       TEXTAREA
    ========================= */

    textarea {
        width: 100%;
        min-height: 120px;

        padding: 16px;

        font-size: 16px;
        font-family: Arial, sans-serif;

        border: 2px solid #dbeafe;
        border-radius: 10px;

        resize: vertical;

        background: #f8fafc;
        color: #1e293b;

        outline: none;

        transition: 0.3s ease;
    }

    textarea::placeholder {
        color: #94a3b8;
    }

    textarea:focus {
        border-color: #6366f1;

        background: #ffffff;

        box-shadow:
            0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    /* =========================
       BUTTON
    ========================= */

    button {
        margin-top: 15px;

        padding: 13px 28px;

        font-size: 16px;
        font-weight: 600;

        color: white;

        background: linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );

        border: none;
        border-radius: 8px;

        cursor: pointer;

        box-shadow:
            0 5px 15px rgba(79, 70, 229, 0.25);

        transition: all 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);

        background: linear-gradient(
            135deg,
            #4338ca,
            #6d28d9
        );

        box-shadow:
            0 8px 20px rgba(79, 70, 229, 0.35);
    }

    button:active {
        transform: translateY(0);
    }

    button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        transform: none;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
        text-align: center;

        margin: 30px;

        display: none;

        color: #4f46e5;

        font-size: 17px;
        font-weight: 600;
    }

    /* Loading animation */

    #loading::after {
        content: "";

        display: inline-block;

        width: 18px;
        height: 18px;

        margin-left: 10px;

        border: 3px solid #c7d2fe;
        border-top-color: #4f46e5;

        border-radius: 50%;

        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* =========================
       ERROR MESSAGE
    ========================= */

    #error {
        margin-top: 20px;

        padding: 15px 18px;

        background: #fef2f2;

        color: #b91c1c;

        border-left: 5px solid #ef4444;

        border-radius: 8px;

        display: none;

        font-size: 15px;
    }

    /* =========================
       QUERIES SECTION
    ========================= */

    .queries {
        background: white;

        padding: 25px;

        margin-top: 30px;

        border-radius: 14px;

        border: 1px solid #e0e7ff;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.06);

        display: none;
    }

    .queries h3 {
        margin-top: 0;

        color: #3730a3;

        font-size: 20px;
    }

    .queries ul {
        padding-left: 25px;
    }

    .queries li {
        margin-bottom: 10px;

        color: #475569;

        line-height: 1.5;
    }

    /* =========================
       ARTICLE CARD
    ========================= */

    .article {
        background: white;

        margin-top: 25px;

        padding: 22px;

        border-radius: 14px;

        border: 1px solid #e2e8f0;

        box-shadow:
            0 6px 20px rgba(0, 0, 0, 0.07);

        transition: all 0.3s ease;

        overflow: hidden;
    }

    .article:hover {
        transform: translateY(-5px);

        box-shadow:
            0 12px 30px rgba(79, 70, 229, 0.15);

        border-color: #c7d2fe;
    }

    /* =========================
       ARTICLE IMAGE
    ========================= */

    .article img {
        width: 100%;

        max-height: 350px;

        object-fit: cover;

        border-radius: 10px;

        margin-bottom: 18px;

        transition: transform 0.4s ease;
    }

    .article:hover img {
        transform: scale(1.02);
    }

    /* =========================
       ARTICLE TITLE
    ========================= */

    .article h2 {
        margin-top: 0;

        margin-bottom: 10px;

        line-height: 1.4;

        color: #1e1b4b;

        font-size: 25px;
    }

    /* =========================
       ARTICLE DESCRIPTION
    ========================= */

    .description {
        color: #475569;

        line-height: 1.7;

        font-size: 16px;

        margin-bottom: 12px;
    }

    /* =========================
       SOURCE
    ========================= */

    .source {
        font-size: 14px;

        color: #64748b;

        margin-top: 10px;
    }

    .source strong {
        color: #4f46e5;
    }

    /* =========================
       READ MORE LINK
    ========================= */

    .read-more {
        display: inline-block;

        margin-top: 12px;

        padding: 9px 16px;

        text-decoration: none;

        font-weight: bold;

        color: white;

        background: #4f46e5;

        border-radius: 6px;

        transition: 0.3s ease;
    }

    .read-more:hover {
        background: #3730a3;

        transform: translateX(3px);
    }

    /* =========================
       NO RESULTS
    ========================= */

    .no-results {
        background: white;

        padding: 30px;

        margin-top: 25px;

        border-radius: 12px;

        text-align: center;

        color: #64748b;

        border: 1px solid #e2e8f0;

        box-shadow:
            0 5px 15px rgba(0, 0, 0, 0.05);
    }

    /* =========================
       ARTICLE CATEGORY BADGE
    ========================= */

    .category {
        display: inline-block;

        padding: 5px 12px;

        margin-bottom: 12px;

        border-radius: 20px;

        background: #ede9fe;

        color: #6d28d9;

        font-size: 13px;

        font-weight: 600;
    }

    /* =========================
       RESPONSIVE DESIGN
    ========================= */

    @media (max-width: 768px) {

        .container {
            width: 94%;
            margin: 30px auto;
        }

        h1 {
            font-size: 30px;
        }

        .subtitle {
            font-size: 15px;
        }

        .search-box {
            padding: 20px;
        }

        textarea {
            min-height: 100px;
        }

        .article {
            padding: 18px;
        }

        .article h2 {
            font-size: 21px;
        }

        .article img {
            max-height: 250px;
        }
    }

    /* =========================
       SMALL MOBILE DEVICES
    ========================= */

    @media (max-width: 480px) {

        h1 {
            font-size: 26px;
        }

        .subtitle {
            font-size: 14px;
        }

        button {
            width: 100%;
        }

        .article h2 {
            font-size: 19px;
        }
    }

</style>

</head>


<body>


<div class="container">


    <h1>
        AI News Search
    </h1>


    <p class="subtitle">

        Ask your news question in natural language.

    </p>


    <!-- SEARCH BOX -->

    <div class="search-box">

        <textarea
            id="question"
            placeholder="Example: latest news on job layoffs because of GPT-6 Astra"
        ></textarea>


        <button
            id="searchButton"
            onclick="searchNews()"
        >

            Search News

        </button>

    </div>


    <!-- LOADING -->

    <div id="loading">

        Searching for news...

    </div>


    <!-- ERROR -->

    <div id="error"></div>


    <!-- GENERATED QUERIES -->

    <div
        id="queries"
        class="queries"
    >

        <h3>
            Search queries generated by AI
        </h3>


        <ul id="query-list"></ul>

    </div>


    <!-- NEWS ARTICLES -->

    <div id="news-container"></div>


</div>


<script>


async function searchNews() {


    // --------------------------------------------------
    // Get user's question
    // --------------------------------------------------

    const question =
        document
            .getElementById("question")
            .value
            .trim();


    // --------------------------------------------------
    // Check input
    // --------------------------------------------------

    if (!question) {

        showError(
            "Please enter a news question."
        );

        return;
    }


    // --------------------------------------------------
    // Get UI elements
    // --------------------------------------------------

    const button =
        document.getElementById(
            "searchButton"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const newsContainer =
        document.getElementById(
            "news-container"
        );


    const queriesContainer =
        document.getElementById(
            "queries"
        );


    // --------------------------------------------------
    // Clear previous results
    // --------------------------------------------------

    newsContainer.innerHTML = "";

    queriesContainer.style.display =
        "none";

    hideError();


    // --------------------------------------------------
    // Show loading
    // --------------------------------------------------

    loading.style.display =
        "block";

    button.disabled = true;


    try {


        // --------------------------------------------------
        // Send question to Flask
        // --------------------------------------------------

        const response = await fetch(

            `/news?question=${encodeURIComponent(
                question
            )}`

        );


        // --------------------------------------------------
        // Convert response to JSON
        // --------------------------------------------------

        const data =
            await response.json();


        // --------------------------------------------------
        // Check error
        // --------------------------------------------------

        if (!response.ok) {

            showError(
                data.error ||
                "Something went wrong."
            );

            return;
        }


        // --------------------------------------------------
        // Display generated search queries
        // --------------------------------------------------

        const queryList =
            document.getElementById(
                "query-list"
            );


        queryList.innerHTML = "";


        data.queries.forEach(
            function(query) {

                const li =
                    document.createElement(
                        "li"
                    );

                li.textContent = query;

                queryList.appendChild(li);

            }
        );


        queriesContainer.style.display =
            "block";


        // --------------------------------------------------
        // Check whether articles exist
        // --------------------------------------------------

        if (
            !data.articles ||
            data.articles.length === 0
        ) {

            newsContainer.innerHTML = `

                <div class="no-results">

                    <h3>
                        No articles found
                    </h3>

                    <p>
                        Try using different keywords.
                    </p>

                </div>

            `;

            return;
        }


        // --------------------------------------------------
        // Display articles
        // --------------------------------------------------

        data.articles.forEach(
            function(article) {


                const articleDiv =
                    document.createElement(
                        "div"
                    );


                articleDiv.className =
                    "article";


                // Image
                let imageHTML = "";


                if (article.image) {

                    imageHTML = `

                        <img
                            src="${article.image}"
                            alt="News image"
                        >

                    `;

                }


                // Description
                const description =
                    article.description ||
                    "No description available.";


                // Source
                const source =
                    article.source ||
                    "Unknown";


                // Published date
                let publishedDate = "";


                if (article.publishedAt) {

                    publishedDate =
                        new Date(
                            article.publishedAt
                        ).toLocaleString();

                }


                articleDiv.innerHTML = `

                    ${imageHTML}

                    <h2>
                        ${escapeHTML(
                            article.title
                        )}
                    </h2>

                    <p class="description">
                        ${escapeHTML(
                            description
                        )}
                    </p>

                    <p class="source">

                        Source:
                        ${escapeHTML(source)}

                        ${
                            publishedDate
                            ?
                            " | " +
                            publishedDate
                            :
                            ""
                        }

                    </p>

                    <a
                        class="read-more"
                        href="${article.url}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        Read Full Article

                    </a>

                `;


                newsContainer.appendChild(
                    articleDiv
                );

            }
        );

    }


    catch (error) {

        console.error(error);


        showError(
            "Unable to connect to the server."
        );

    }


    finally {

        loading.style.display =
            "none";

        button.disabled = false;

    }

}


// --------------------------------------------------
// Show error
// --------------------------------------------------

function showError(message) {

    const error =
        document.getElementById(
            "error"
        );


    error.textContent = message;

    error.style.display =
        "block";

}


// --------------------------------------------------
// Hide error
// --------------------------------------------------

function hideError() {

    const error =
        document.getElementById(
            "error"
        );


    error.style.display =
        "none";

}


// --------------------------------------------------
// Basic HTML escaping
// --------------------------------------------------

function escapeHTML(value) {

    if (!value) {
        return "";
    }


    const div =
        document.createElement(
            "div"
        );


    div.textContent = value;


    return div.innerHTML;

}


// --------------------------------------------------
// Press Enter + Ctrl to search
// --------------------------------------------------

document
    .getElementById("question")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                event.ctrlKey
            ) {

                searchNews();

            }

        }
    );


</script>


</body>

</html>
