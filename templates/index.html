<!DOCTYPE html>
<html>
<head>
    <title>News Search App</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .article {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            border-radius: 10px;
        }

        .article img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
        }

        .article a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>News Search App</h1>

    <div class="search-box">

        <input
            type="text"
            id="topic"
            placeholder="Enter topic e.g. Python"
        >

        <button onclick="searchNews()">
            Search
        </button>

    </div>

    <div id="news-container"></div>


    <script>

        async function searchNews() {

            const topic = document.getElementById("topic").value;

            if (!topic) {
                alert("Please enter a topic");
                return;
            }

            const container =
                document.getElementById("news-container");

            container.innerHTML = "<p>Loading...</p>";

            try {

                const response = await fetch(
                    `/news?topic=${encodeURIComponent(topic)}`
                );

                const data = await response.json();

                if (!response.ok) {

                    container.innerHTML =
                        `<p>${data.error}</p>`;

                    return;
                }

                container.innerHTML = "";

                data.articles.forEach(article => {

                    const div = document.createElement("div");

                    div.className = "article";

                    div.innerHTML = `

                        ${
                            article.image
                            ?
                            `<img src="${article.image}">`
                            :
                            ""
                        }

                        <h2>${article.title}</h2>

                        <p>
                            ${article.description || ""}
                        </p>

                        <p>
                            Source: ${article.source || "Unknown"}
                        </p>

                        <a
                            href="${article.url}"
                            target="_blank"
                        >
                            Read Full Article
                        </a>
                    `;

                    container.appendChild(div);

                });

            }

            catch (error) {

                container.innerHTML =
                    "<p>Something went wrong.</p>";

            }

        }

    </script>

</body>
</html>
